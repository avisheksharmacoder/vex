[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vexdb"
version = "0.1.0"
description = "High-speed C11 columnar storage engine with a Pythonic query language"
license = "MIT"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=7.0", "numpy>=1.24"]

[project.scripts]
vex = "vex_cli:main"

